name: Worker Preview Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

concurrency:
  group: worker-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  WORKER_NAME: astro-preview-agent-eval

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Deploy Worker Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          OUTPUT=$(npx wrangler preview --json --name "$PREVIEW_NAME" --tag "${{ github.sha }}" --message "PR #${{ github.event.pull_request.number }} preview")
          printf '%s\n' "$OUTPUT"

          PREVIEW_JSON=$(printf '%s' "$OUTPUT" | node -e 'const fs = require("node:fs"); const text = fs.readFileSync(0, "utf8"); const start = text.indexOf("{"); if (start < 0) process.exit(1); process.stdout.write(text.slice(start));')
          PREVIEW_URL=$(printf '%s' "$PREVIEW_JSON" | jq -r '.preview.urls[0] // empty')
          DEPLOYMENT_ID=$(printf '%s' "$PREVIEW_JSON" | jq -r '.deployment.id // empty')

          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Could not find a preview URL in wrangler output"
            exit 1
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Capture screenshot with Browser Run
        id: screenshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEBUG_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p preview-output
          REQUEST=$(jq -nc \
            --arg url "${PREVIEW_URL}?debugId=${DEBUG_ID}" \
            --arg accessClientId "$CF_ACCESS_CLIENT_ID" \
            --arg accessClientSecret "$CF_ACCESS_CLIENT_SECRET" \
            '{
            url: $url,
            setExtraHTTPHeaders: {
              "CF-Access-Client-Id": $accessClientId,
              "CF-Access-Client-Secret": $accessClientSecret
            },
            viewport: { width: 1440, height: 1000 },
            selector: "main"
          }')

          STATUS=$(curl -sS \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/browser-rendering/screenshot" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST" \
            --output preview-output/screenshot.png \
            --write-out "%{http_code}")

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Browser Run screenshot request failed with HTTP ${STATUS}"
            cat preview-output/screenshot.png
            exit 1
          fi

          test -s preview-output/screenshot.png
          echo "debug_id=$DEBUG_ID" >> "$GITHUB_OUTPUT"

      - name: Probe Preview runtime
        id: runtime-probe
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEBUG_ID: ${{ steps.screenshot.outputs.debug_id }}
        run: |
          set -euo pipefail
          mkdir -p preview-output

          probe() {
            local name="$1"
            local path="$2"
            local output="preview-output/${name}.json"
            local status

            status=$(curl -sS \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              -H "x-debug-id: ${DEBUG_ID}" \
              "${PREVIEW_URL}${path}?debugId=${DEBUG_ID}" \
              --output "$output" \
              --write-out "%{http_code}" || true)

            local request_id
            request_id=$(jq -r '.requestId // "unknown"' "$output")
            local snippet
            snippet=$(jq -c . "$output" | cut -c 1-300)

            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$path" "$status" "$request_id" "$snippet" >> preview-output/probes.tsv
          }

          : > preview-output/probes.tsv
          probe health /api/health
          probe catalog /api/catalog/sync
          probe quote /api/checkout/quote

          {
            echo 'probes<<EOF'
            node <<'NODE'
          const fs = require('node:fs');
          const rows = fs.readFileSync('preview-output/probes.tsv', 'utf8').trim().split('\n').filter(Boolean);
          console.log(rows.map((row) => {
            const [name, path, status, requestId, snippet] = row.split('\t');
            return `| ${name} | \`${path}\` | \`${status}\` | \`${requestId}\` | \`${snippet.replaceAll('|', '\\|')}\` |`;
          }).join('\n'));
          NODE
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish screenshot for PR comment
        id: publish-screenshot
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_BRANCH: preview-artifacts-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORKTREE=$(mktemp -d)
          if git ls-remote --exit-code --heads origin "$ARTIFACT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$ARTIFACT_BRANCH"
            git worktree add "$WORKTREE" "origin/$ARTIFACT_BRANCH"
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" switch --orphan "$ARTIFACT_BRANCH"
            git -C "$WORKTREE" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$WORKTREE/screenshots"
          SCREENSHOT_FILE="${GITHUB_SHA}.png"
          cp preview-output/screenshot.png "$WORKTREE/screenshots/${SCREENSHOT_FILE}"
          cp preview-output/screenshot.png "$WORKTREE/screenshots/latest.png"
          git -C "$WORKTREE" add "screenshots/${SCREENSHOT_FILE}" screenshots/latest.png
          git -C "$WORKTREE" commit -m "Update screenshot for PR ${PR_NUMBER}" || true
          git -C "$WORKTREE" push origin "HEAD:$ARTIFACT_BRANCH"

          SCREENSHOT_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ARTIFACT_BRANCH}/screenshots/${SCREENSHOT_FILE}"
          echo "screenshot_url=$SCREENSHOT_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          SCREENSHOT_URL: ${{ steps.publish-screenshot.outputs.screenshot_url }}
          DEBUG_ID: ${{ steps.screenshot.outputs.debug_id }}
          PROBES: ${{ steps.runtime-probe.outputs.probes }}
        with:
          script: |
            const marker = '<!-- worker-preview-evidence:astro-preview-agent-eval -->';
            const previewName = `pr-${context.issue.number}`;
            const branch = context.payload.pull_request.head.ref;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const wobsPath = `/workers/services/view/${process.env.WORKER_NAME}/production/previews/${previewName}/observability/events`;

            const body = `${marker}
            ## Preview Evidence

            [Open the latest Preview](${process.env.PREVIEW_URL})

            ![Browser Run screenshot of the Preview](${process.env.SCREENSHOT_URL})

            | Field | Value |
            | --- | --- |
            | Preview | \`${previewName}\` |
            | Branch | \`${branch}\` |
            | Commit | \`${sha}\` |
            | Deployment | \`${process.env.DEPLOYMENT_ID || 'unknown'}\` |
            | Worker | \`${process.env.WORKER_NAME}\` |
            | Debug ID | \`${process.env.DEBUG_ID}\` |
            | WOBS path | \`${wobsPath}\` |

            ### Runtime Probes

            | Probe | Path | Status | Request ID | Response snippet |
            | --- | --- | --- | --- | --- |
            ${process.env.PROBES}

            Use the screenshot, Preview URL, WOBS path, debug ID, request IDs, and response snippets to decide whether this PR needs a code change.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund

      - name: Delete Worker Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: npx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation || true

      - name: Delete screenshot branch
        env:
          ARTIFACT_BRANCH: preview-artifacts-pr-${{ github.event.pull_request.number }}
        run: git push origin --delete "$ARTIFACT_BRANCH" || true

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --tag "${{ github.sha }}" --message "${{ github.event.head_commit.message }}"
